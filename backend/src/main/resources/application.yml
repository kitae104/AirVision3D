# AirVision 3D Backend 설정
# 민감한 값은 루트 .env 파일에서 주입한다. (.env.example 참고)
server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: airvision-backend
  config:
    # 루트 .env를 자동 로드 (backend/ 에서 실행 시 ../.env, 루트에서 실행 시 .env)
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:airvision}
    username: ${POSTGRES_USER:airvision}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리하므로 검증만 수행
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

airvision:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  # 데모용 샘플 관측값 자동 보충: 기동 시 + 매시 5분, 빠진 시간대만 채움(삭제·덮어쓰기 없음).
  # 대시보드 24시간 차트가 비지 않게 유지한다. 합성 데이터 자동 생성을 원치 않으면 false.
  sample:
    auto-reseed: ${SAMPLE_AUTO_RESEED:true}
  # 공공데이터포털 연동 (키가 없으면 mock-enabled=auto에 의해 Mock 데이터로 동작)
  public-data:
    mock-enabled: ${PUBLIC_DATA_MOCK_ENABLED:auto}   # auto | true | false
    cache:
      realtime-seconds: ${AIR_QUALITY_CACHE_TTL:1800}
      stations-seconds: 86400
      forecast-seconds: 3600
      alerts-seconds: 1800
      weather-seconds: ${WEATHER_CACHE_TTL:1800}
    comparison:
      max-distance-km: ${COMPARISON_MAX_DISTANCE_KM:5}
      max-minutes: ${COMPARISON_MAX_MINUTES:60}
    collection:
      enabled: ${PUBLIC_DATA_COLLECTION_ENABLED:true}
      cron: "0 10 * * * *"
      cleanup-cron: "0 30 3 * * *"
      retention-days: ${PUBLIC_DATA_RETENTION_DAYS:180}
      collect-on-startup: ${PUBLIC_DATA_COLLECT_ON_STARTUP:true}
      sidos: [서울, 인천, 경기]
      weather-points:
        - { sido: 서울, latitude: 37.5665, longitude: 126.9780 }
        - { sido: 인천, latitude: 37.4563, longitude: 126.7052 }
        - { sido: 경기, latitude: 37.2636, longitude: 127.0286 }
  airkorea:
    service-key: ${AIRKOREA_SERVICE_KEY:}
    base-url: ${AIRKOREA_BASE_URL:https://apis.data.go.kr/B552584}
    default-sido: ${AIRKOREA_DEFAULT_SIDO:인천}
  kma:
    service-key: ${KMA_SERVICE_KEY:}
    base-url: ${KMA_BASE_URL:https://apis.data.go.kr/1360000}
  # 인천환경공단 악취 측정 데이터 (공공데이터포털 파일데이터 자동변환 OpenAPI, 연 1회 개방)
  # 키가 없으면 public-data.mock-enabled=auto에 의해 Mock 데이터로 동작.
  # 실키 사용 시 각 데이터셋(15105070/15105071/15105073)의 활용신청이 필요하다.
  odor:
    service-key: ${ODOR_SERVICE_KEY:}
    base-url: ${ODOR_BASE_URL:https://api.odcloud.kr/api}
    cache-seconds: 86400
    per-page: 500
    datasets:
      - office: 가좌사업소
        path: /15105070/v1/uddi:76eeccb4-f548-4c88-afd1-b5e61d00f080
        fixture: gajwa.json
      - office: 승기사업소
        path: /15105071/v1/uddi:b6e2bbcc-09c1-4053-a7fc-80af720bc53c
        fixture: seunggi.json
      - office: 송도사업소
        path: /15105073/v1/uddi:21a67adc-88aa-430e-af34-f89cbf921a18
        fixture: songdo.json
  # ITS 국가교통정보센터 실시간 도로 CCTV (인천 핵심 3구, HLS 스트림)
  # 키는 its.go.kr 오픈API 신청으로 발급 (공공데이터포털 키와 별개). 없으면 Mock 동작.
  its:
    service-key: ${ITS_CCTV_KEY:}
    base-url: ${ITS_BASE_URL:https://openapi.its.go.kr:9443}
    cache-seconds: 300
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-hours: 12
  init:
    admin-password: ${ADMIN_INIT_PASSWORD:admin1234!}
    user-password: ${USER_INIT_PASSWORD:user1234!}
  # 미세먼지 등급 기준 (설정 파일 관리, ai-service config/grades.json과 동일 값 유지)
  pm25-grades:
    - name: 좋음
      upper: 15
    - name: 보통
      upper: 35
    - name: 나쁨
      upper: 75
    - name: 매우나쁨
      upper:

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
