# AirVision 3D Backend 설정
# 민감한 값은 루트 .env 파일에서 주입한다. (.env.example 참고)
server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: airvision-backend
  config:
    # 루트 .env를 자동 로드 (backend/ 에서 실행 시 ../.env, 루트에서 실행 시 .env)
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:airvision}
    username: ${POSTGRES_USER:airvision}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리하므로 검증만 수행
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# AI 서비스 주소 (Phase 5에서 사용 예정)
airvision:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
